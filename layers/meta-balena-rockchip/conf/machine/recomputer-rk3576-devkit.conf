#@TYPE: Machine
#@NAME: Seeed reComputer RK3576 DevKit
#@DESCRIPTION: Seeed RK3576 development kit with eMMC, SD, SPI-NOR and M.2 NVMe.

# Use the Rockchip layer shipped inside the staged official SDK.  The SDK
# layer supplies the common RK3576 tune and Rockchip defaults; this machine
# keeps its own kernel/U-Boot recipes for the Balena + Seeed integration,
# mirroring the proven recomputer-rk3588-devkit setup.
require conf/machine/include/rk3576.inc

MACHINEOVERRIDES =. "recomputer-rk3576-devkit:"

PREFERRED_PROVIDER_virtual/kernel = "linux-seeed-rk3576"
# The SDK layer also provides u-boot-rockchip, but this machine must use the
# Balena-aware externalsrc u-boot recipe below so the official SDK tree is
# combined with the Seeed DTS and Balena boot command.
PREFERRED_PROVIDER_virtual/bootloader = "u-boot"
# Same opencl-icd-loader drop as RK3588: the SDK Mali recipe pulls in OpenCL
# userspace that Balena's distro feature set does not provide.
RDEPENDS:rockchip-libmali:remove:recomputer-rk3576-devkit = "opencl-icd-loader"

KERNEL_DEVICETREE = "rockchip/rk3576-recomputer-rk3576-devkit.dtb"
KERNEL_IMAGETYPE = "Image"
# Wrynose removed the legacy kernel-fitimage.bbclass. This machine boots the
# plain Image through U-Boot extlinux, so do not inherit the old FIT class
# selected by meta-rockchip's SoC include.
KERNEL_CLASSES = ""
UBOOT_MACHINE = "recomputer-rk3576-devkit_defconfig"

MACHINE_EXTRA_RRECOMMENDS += "kernel-modules"

# The official Rockchip/Seeed kernel keeps UART0 behind the FIQ debugger
# (rockchip,serial-id = <0>, mmio 0x2ad40000 in rk3576-linux.dtsi).  The
# physical debug UART is therefore exposed as ttyFIQ0 rather than ttyS0.
SERIAL_CONSOLES = "1500000;ttyFIQ0"

# Keep the board DTB and U-Boot artifacts available to Balena's boot and
# flasher images.  The two ethernet ports are SoC GMACs with RTL8211F PHYs
# (no NIC firmware needed, unlike the RK3588 devkit's PCIe RTL8125 pair).
# AIC8800 SDIO WiFi/BT is onboard; the firmware recipe covers the module
# variants.  Everything else mirrors the validated RK3588 image set.
# NOTE: the rkaiq/rkisp camera 3A stack is deliberately NOT installed yet:
# the RK3588 porting records flag the rk3576-side prebuilt .a blobs in the
# Seeed rkaiq source tree as broken (phase-5 leftover #11), and the board
# cam dtsi ships all sensor nodes disabled.  Re-add rockchip-rkaiq-server/
# iqfiles and rockchip-rkisp-server/iqfiles once the rk3576 blobs are
# verified (peripheral phase).
IMAGE_INSTALL:append = " \
    kernel-devicetree \
    u-boot-extlinux \
    aic8800-firmware \
    usb-gadget-network \
    board-access-keys \
    rockchip-mpp \
    gstreamer1.0-rockchip \
    gstreamer1.0-plugins-base \
    gstreamer1.0-plugins-good-jpeg \
    gstreamer1.0-plugins-good-video4linux2 \
    v4l-utils \
    media-ctl \
"
