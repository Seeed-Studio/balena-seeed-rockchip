CONFIG_ARCH_ROCKCHIP=y
CONFIG_BLOCK=y
CONFIG_COMMON_CLK_ROCKCHIP=y
CONFIG_NVMEM=y
CONFIG_ARM_ROCKCHIP_CPUFREQ=y
CONFIG_SERIAL_8250=y
CONFIG_SERIAL_8250_CONSOLE=y
CONFIG_MMC=y
CONFIG_MMC_BLOCK=y
CONFIG_MMC_DW=y
CONFIG_MMC_DW_ROCKCHIP=y
CONFIG_BLK_DEV_NVME=y
CONFIG_EXT4_FS=y
# The runtime rootA is a mobynit stub: /sbin/init assembles the real OS root
# from the preloaded docker overlay2 layers with an overlayfs mount before
# pivoting into it.  It runs before any module loading, so overlayfs must be
# built in or mobynit dies with "mounting overlay" and PID1 exits.
CONFIG_OVERLAY_FS=y
# systemd's mnt-sysroot-inactive.automount mounts the inactive root
# partition on demand; hostapp-update and the balena-host engine
# (--data-root=/mnt/sysroot/inactive/balena) depend on it.  Built in so the
# mount works before any module loading, same policy as overlayfs above.
CONFIG_AUTOFS_FS=y
# balena-engine (balenad) requirements.  Everything is built in (=y): the
# runtime OS root is an overlay image assembled at boot and module loading
# is not dependable.  NF_CONNTRACK comes first: the whole NAT family
# (NF_NAT, IP_NF_NAT, MASQUERADE, XT_NAT) depends on it and silently drops
# =y without it, which leaves balenad with "iptables table 'nat' does not
# exist".
CONFIG_NF_CONNTRACK=y
CONFIG_MEMCG=y
CONFIG_CGROUP_PIDS=y
CONFIG_BRIDGE=y
CONFIG_BRIDGE_NETFILTER=y
CONFIG_VETH=y
CONFIG_DUMMY=y
CONFIG_MACVLAN=y
CONFIG_IPVLAN=y
CONFIG_VXLAN=y
CONFIG_NF_TABLES=y
CONFIG_NF_TABLES_INET=y
CONFIG_NF_TABLES_IPV4=y
CONFIG_NF_NAT=y
CONFIG_NETFILTER_XT_NAT=y
CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
CONFIG_NETFILTER_XT_MATCH_COMMENT=y
CONFIG_NETFILTER_XT_MATCH_CONNTRACK=y
CONFIG_NETFILTER_XT_TARGET_MASQUERADE=y
CONFIG_IP_NF_FILTER=y
CONFIG_IP_NF_NAT=y
CONFIG_IP_NF_TARGET_MASQUERADE=y
CONFIG_IP_NF_TARGET_REDIRECT=y
# Supervisor "firewall mode" pushes an iptables ruleset that uses the REJECT
# target; without these the restore dies ("Extension REJECT revision 0 not
# supported") and the supervisor logs a non-fatal firewall error every start.
# The ruleset also carries an IPv6 variant, which needs the ip6tables filter
# table infrastructure.  NOTE: IP6_NF_IPTABLES does NOT select IP6_NF_FILTER
# - list the sub-symbols explicitly or the v6 table stays absent and
# ip6tables-restore dies with "Module ip6_tables not found".
CONFIG_NF_REJECT_IPV4=y
CONFIG_IP_NF_TARGET_REJECT=y
CONFIG_NF_REJECT_IPV6=y
CONFIG_IP6_NF_IPTABLES=y
CONFIG_IP6_NF_FILTER=y
CONFIG_IP6_NF_TARGET_REJECT=y
# balenaCloud VPN (openvpn, dev resin-vpn) needs the universal TUN/TAP
# device: without CONFIG_TUN there is no /dev/net/tun and openvpn exits with
# "Cannot open TUN/TAP dev" right after a successful TLS handshake.
CONFIG_TUN=y
CONFIG_POSIX_MQUEUE=y
# meta-balena's udev hook zram-swap-init unconditionally writes "lz4" to
# /sys/block/zram0/comp_algorithm under "set -e".  Without CRYPTO_LZ4 the
# kernel only offers lzo/lzo-rle, the write fails, and dev-zram0.swap never
# comes up.
CONFIG_CRYPTO_LZ4=y
# cgroup v2 implements the device controller through BPF: runc sets it up
# with bpf_prog_query(BPF_CGROUP_DEVICE), which needs the bpf() syscall and
# CGROUP_BPF.
CONFIG_BPF_SYSCALL=y
CONFIG_BPF_JIT=y
CONFIG_CGROUP_BPF=y
CONFIG_DEVTMPFS=y
CONFIG_DEVTMPFS_MOUNT=y
CONFIG_TMPFS=y
CONFIG_PROC_FS=y
CONFIG_ROCKCHIP_MPP_PROC_FS=y
CONFIG_RTC_HCTOSYS=y
CONFIG_RTC_HCTOSYS_DEVICE="rtc0"
CONFIG_NET=y
CONFIG_INET=y
# Both ethernet ports are SoC GMACs wired to RTL8211F PHYs (rgmii-rxid, see
# the board DTS).  STMMAC_ETH is in the vendor defconfig but the Rockchip
# platform glue (DWMAC_ROCKCHIP) and the Realtek PHY driver are not, and
# alldefconfig leaves them out - without them no eth interface ever
# appears.  Same silent-drop family as NF_CONNTRACK above.
CONFIG_STMMAC_ETH=y
CONFIG_DWMAC_ROCKCHIP=y
CONFIG_REALTEK_PHY=y
# The PCA9535 expander on i2c4 carries the user LED and camera/power
# enables referenced by the board DTS (gpio_xten), so it must be built in.
CONFIG_GPIO_PCA953X=y
CONFIG_USB_SUPPORT=y
CONFIG_USB_DWC3=y
CONFIG_USB_DWC3_OF_SIMPLE=y
CONFIG_USB_XHCI_HCD=y
CONFIG_USB_STORAGE=y
# SDIO WiFi module (AIC8800 family).  The vendor driver lives in the SDK
# kernel tree at drivers/net/wireless/aic8800_sdio.  WLAN/BTLPM build as
# modules: they request firmware at probe time, which must not happen
# before the OS root is assembled.  The module variant on the RK3576 board
# is confirmed on hardware; the plain aic8800 firmware set is the default
# and aic_fw_path can be retuned from modprobe without a rebuild.
CONFIG_AIC_WLAN_SUPPORT=y
CONFIG_AIC8800_WLAN_SUPPORT=m
CONFIG_AIC8800_BTLPM_SUPPORT=m
CONFIG_AIC_FW_PATH="/lib/firmware/aic8800/SDIO/aic8800D80/"
# USB gadget function set.  The framework (GADGET/LIBCOMPOSITE/CONFIGFS plus
# ACM, MASS_STORAGE, F_FS, UVC) is already built in; these complete the
# network passthrough functions used for Type-C device mode (NCM/ECM/EEM on
# Linux hosts, RNDIS on Windows) and HID.
CONFIG_USB_CONFIGFS_NCM=y
CONFIG_USB_CONFIGFS_ECM=y
CONFIG_USB_CONFIGFS_ECM_SUBSET=y
CONFIG_USB_CONFIGFS_EEM=y
CONFIG_USB_CONFIGFS_RNDIS=y
CONFIG_USB_CONFIGFS_F_HID=y
# HDMI/DP kernel console: without CONFIG_FB there is no fbdev, fbcon never
# binds and nothing ever issues a modeset - a connected monitor stays
# black.  fbdev emulation on top of the rockchip DRM driver makes the
# kernel console appear on screen.
CONFIG_FB=y
CONFIG_DRM_FBDEV_EMULATION=y
CONFIG_FRAMEBUFFER_CONSOLE=y
# Mali-G52 GPU (Bifrost) uses the in-tree panfrost driver, mirroring the
# Seeed Armbian RK3576 kernel config (RECOMPUTER_GPU_STACK=panfrost).  The
# closed vendor kbase stacks are kept out; userspace stays in containers
# (Mesa), the OS only provides /dev/dri/renderD128.
CONFIG_DRM_PANFROST=y
# Camera: both cam seats target Raspberry Pi form-factor modules (IMX219
# v2 / IMX708 v3 + DW9817 VCM, see recomputer-rk3576-devkit-cam.dtsi).
CONFIG_VIDEO_IMX219=y
CONFIG_VIDEO_IMX708=y

# The vendor defconfig enables the unrelated Broadcom V3D module and the
# Rockchip kbase GPU stacks; RK3576 uses the panfrost path instead and the
# legacy drivers do not build against this tree's APIs.
# CONFIG_DRM_V3D is not set
# CONFIG_MALI400 is not set
# CONFIG_MALI450 is not set
# CONFIG_MALI_MIDGARD is not set
# CONFIG_MALI_BIFROST is not set
# CONFIG_MALI_VALHALL is not set
