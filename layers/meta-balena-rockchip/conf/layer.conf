BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "balena-rockchip"
BBFILE_PATTERN_balena-rockchip := "^${LAYERDIR}/"
BBFILE_PRIORITY_balena-rockchip = "1337"

# the machine confs require the include chain (rk3576.inc/rk3588.inc) and
# multimedia recipes from the meta-rockchip collection
LAYERDEPENDS_balena-rockchip += "rockchip"

LAYERSERIES_COMPAT_balena-rockchip = "wrynose"


# we need only the initramfs kernel in the rootfs so we remove the non-initramfs version
MACHINE_ESSENTIAL_EXTRA_RDEPENDS:remove = "kernel-image"

# the BSP sets this as fitImage but we don't use it because the flasher has problems when booting with an older u-boot and a fitImage kernel type
KERNEL_IMAGETYPE = "Image"

# The kernel-headers-test recipe referenced by image-balena.bbclass is a
# balena-cloud internal recipe (it pulls a base image from Docker Hub at
# build time) and does not exist in this tree, so the extra kernel-headers
# build-time dependencies must stay disabled.  Image contents are
# unaffected; set BALENA_DISABLE_KERNEL_HEADERS = "0" in local.conf to
# build them in a tree that provides the recipe.
BALENA_DISABLE_KERNEL_HEADERS = "1"
