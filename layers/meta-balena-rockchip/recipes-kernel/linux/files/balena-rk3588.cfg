CONFIG_ARCH_ROCKCHIP=y
CONFIG_BLOCK=y
CONFIG_COMMON_CLK_ROCKCHIP=y
CONFIG_NVMEM=y
CONFIG_ARM_ROCKCHIP_CPUFREQ=y
CONFIG_SERIAL_8250=y
CONFIG_SERIAL_8250_CONSOLE=y
CONFIG_MMC=y
CONFIG_MMC_BLOCK=y
CONFIG_MMC_DW=y
CONFIG_MMC_DW_ROCKCHIP=y
CONFIG_BLK_DEV_NVME=y
CONFIG_EXT4_FS=y
# The runtime rootA is a mobynit stub: /sbin/init assembles the real OS root
# from the preloaded docker overlay2 layers with an overlayfs mount before
# pivoting into it.  It runs before any module loading, so overlayfs must be
# built in or mobynit dies with "mounting overlay" and PID1 exits.
CONFIG_OVERLAY_FS=y
# balena-engine (balenad) requirements.  The trimmed defconfig left the whole
# container stack out; without bridge/veth/nat/memcg the daemon wedges in
# "activating" forever.  Everything is built in (=y): the runtime OS root is
# an overlay image assembled at boot and module loading is not dependable.
# NF_CONNTRACK comes first: the whole NAT family (NF_NAT, IP_NF_NAT,
# MASQUERADE, XT_NAT) depends on it and silently drops =y without it, which
# leaves balenad with "iptables table 'nat' does not exist".
CONFIG_NF_CONNTRACK=y
CONFIG_MEMCG=y
CONFIG_CGROUP_PIDS=y
CONFIG_BRIDGE=y
CONFIG_BRIDGE_NETFILTER=y
CONFIG_VETH=y
CONFIG_DUMMY=y
CONFIG_MACVLAN=y
CONFIG_IPVLAN=y
CONFIG_VXLAN=y
CONFIG_NF_TABLES=y
CONFIG_NF_TABLES_INET=y
CONFIG_NF_TABLES_IPV4=y
CONFIG_NF_NAT=y
CONFIG_NETFILTER_XT_NAT=y
CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
CONFIG_NETFILTER_XT_MATCH_COMMENT=y
CONFIG_NETFILTER_XT_MATCH_CONNTRACK=y
CONFIG_NETFILTER_XT_TARGET_MASQUERADE=y
CONFIG_IP_NF_FILTER=y
CONFIG_IP_NF_NAT=y
CONFIG_IP_NF_TARGET_MASQUERADE=y
CONFIG_IP_NF_TARGET_REDIRECT=y
CONFIG_POSIX_MQUEUE=y
# meta-balena's udev hook zram-swap-init unconditionally writes "lz4" to
# /sys/block/zram0/comp_algorithm under "set -e".  Without CRYPTO_LZ4 the
# kernel only offers lzo/lzo-rle, the write fails, and dev-zram0.swap never
# comes up (the only failed unit left on the board).  CRYPTO_LZ4 selects
# LZ4_COMPRESS/LZ4_DECOMPRESS on its own.
CONFIG_CRYPTO_LZ4=y
# cgroup v2 implements the device controller through BPF: runc sets it up with
# bpf_prog_query(BPF_CGROUP_DEVICE), which needs the bpf() syscall and
# CGROUP_BPF.  Without them every container start dies in OCI runtime create
# with "bpf_prog_query failed: function not implemented" (supervisor looped
# here).  Same silent-drop family as NF_CONNTRACK above: BPF_SYSCALL was
# missing so CGROUP_BPF never even appeared as a Kconfig option.
CONFIG_BPF_SYSCALL=y
CONFIG_BPF_JIT=y
CONFIG_CGROUP_BPF=y
CONFIG_DEVTMPFS=y
CONFIG_DEVTMPFS_MOUNT=y
CONFIG_TMPFS=y
CONFIG_PROC_FS=y
CONFIG_ROCKCHIP_MPP_PROC_FS=y
CONFIG_RTC_HCTOSYS=y
CONFIG_RTC_HCTOSYS_DEVICE="rtc0"
CONFIG_NET=y
CONFIG_INET=y
# Both ethernet ports are PCIe RTL8125 NICs (pcie2x1l0/l2 in the board DTS,
# there is no SoC GMAC wiring on this board).  r8169 is the in-tree driver for
# them; without it no eth interface ever appears.  Armbian ships the same
# driver as =m.
CONFIG_R8169=y
CONFIG_USB_SUPPORT=y
CONFIG_USB_DWC3=y
CONFIG_USB_DWC3_OF_SIMPLE=y
CONFIG_USB_XHCI_HCD=y
CONFIG_USB_STORAGE=y
# SDIO WiFi module (AIC8800D80).  The vendor driver lives in the SDK kernel
# tree at drivers/net/wireless/aic8800_sdio (hooked via AIC_WLAN_SUPPORT in
# drivers/net/wireless Kconfig/Makefile).  WLAN/BTLPM build as modules: they
# request firmware at probe time, which must not happen before the OS root
# is assembled.  AIC_FW_PATH is where the bsp driver reads its firmware
# files from (/lib is a symlink to usr/lib in the merged rootfs).
CONFIG_AIC_WLAN_SUPPORT=y
CONFIG_AIC8800_WLAN_SUPPORT=m
CONFIG_AIC8800_BTLPM_SUPPORT=m
CONFIG_AIC_FW_PATH="/lib/firmware/aic8800/SDIO/aic8800D80/"
# USB gadget function set.  The framework (GADGET/LIBCOMPOSITE/CONFIGFS plus
# ACM, MASS_STORAGE, F_FS, UVC) is already built in; these complete the
# network passthrough functions used for Type-C device mode (NCM/ECM/EEM on
# Linux hosts, RNDIS on Windows) and HID.
CONFIG_USB_CONFIGFS_NCM=y
CONFIG_USB_CONFIGFS_ECM=y
CONFIG_USB_CONFIGFS_ECM_SUBSET=y
CONFIG_USB_CONFIGFS_EEM=y
CONFIG_USB_CONFIGFS_RNDIS=y
CONFIG_USB_CONFIGFS_F_HID=y
# HDMI/DP kernel console: the trimmed defconfig left CONFIG_FB off entirely,
# so no fbdev exists, fbcon never binds and nothing ever issues a modeset --
# a connected monitor stayed black.  fbdev emulation on top of the rockchip
# DRM driver makes the kernel console appear on screen.
CONFIG_FB=y
CONFIG_DRM_FBDEV_EMULATION=y
CONFIG_FRAMEBUFFER_CONSOLE=y
# Mali-G610 GPU (vendor valhall kbase driver, matches the "arm,mali-valhall"
# DT node the board DTS already enables).  Mirrors the SDK's own rk3588.config
# fragment: the "rk" platform name selects the Rockchip power/clock glue.
# Userspace stays in containers (libmali), the OS only provides /dev/mali0.
CONFIG_MALI_VALHALL=y
CONFIG_MALI_VALHALL_PLATFORM_NAME="rk"
# Camera: the DevKit cam0 connector (i2c3, enabled in the cam dtsi) is wired
# for Raspberry Pi form-factor modules.  The actual module on the bench is a
# Pi Camera v3 (IMX708 @0x1a + DW9817 VCM @0x0c, chip id 0x0708 verified over
# I2C); its driver was ported from the Seeed Armbian kernel tree into
# bsp/rockchip-sdk (drivers/media/i2c/imx708.c + Kconfig/Makefile hooks).
# The v3 module carries its own 24MHz oscillator, so the dtsi's fixed-clock
# is correct for it (unlike the v2/IMX219, which needs a SoC CAMARAOUT pin).
CONFIG_VIDEO_IMX219=y
CONFIG_VIDEO_IMX708=y

# The vendor defconfig enables the unrelated Broadcom V3D module.  Its
# driver API does not match this kernel tree's DRM scheduler interface and
# RK3588 uses the Rockchip/Mali display path instead.
# CONFIG_DRM_V3D is not set
# The SDK defconfig also enables legacy Mali-400/Midgard drivers whose
# vendor sources do not build against this kernel's 6.1 APIs. RK3588 boot
# and media validation do not require either legacy driver.
# CONFIG_MALI400 is not set
# CONFIG_MALI450 is not set
# CONFIG_MALI_MIDGARD is not set
