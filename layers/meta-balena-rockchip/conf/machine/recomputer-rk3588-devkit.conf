#@TYPE: Machine
#@NAME: Seeed reComputer RK3588 DevKit
#@DESCRIPTION: Seeed RK3588 development kit with eMMC, SD, SPI-NOR and NVMe.

# Use the Rockchip layer shipped inside the staged official SDK, not the
# Radxa meta-rockchip repository.  The SDK layer supplies the common RK3588
# tune and Rockchip defaults; this machine keeps its own kernel/U-Boot recipes
# for the Balena + Seeed integration.
require conf/machine/include/rk3588.inc

MACHINEOVERRIDES =. "recomputer-rk3588-devkit:"

PREFERRED_PROVIDER_virtual/kernel = "linux-seeed-rk3588"
# The SDK layer also provides u-boot-rockchip, but this machine must use the
# Balena-aware externalsrc u-boot recipe below so the official SDK tree is
# combined with the Seeed DTS and Balena boot command.
PREFERRED_PROVIDER_virtual/bootloader = "u-boot"
# The SDK Mali recipe adds OpenCL userspace by default. Balena's distro does
# not enable the OpenCL feature, and this image does not consume OpenCL; avoid
# making the complete image unbuildable on that optional dependency.
RDEPENDS:rockchip-libmali:remove:recomputer-rk3588-devkit = "opencl-icd-loader"

KERNEL_DEVICETREE = "rockchip/rk3588-recomputer-rk3588-devkit.dtb"
KERNEL_IMAGETYPE = "Image"
# Wrynose removed the legacy kernel-fitimage.bbclass. This machine boots the
# plain Image through U-Boot extlinux, so do not inherit the old FIT class
# selected by meta-rockchip's rk3588s include.
KERNEL_CLASSES = ""
UBOOT_MACHINE = "recomputer-rk3588-devkit_defconfig"

MACHINE_EXTRA_RRECOMMENDS += "kernel-modules"

# The official Rockchip/Seeed kernel keeps UART2 behind the FIQ debugger.
# The physical debug UART is therefore exposed as ttyFIQ0 rather than ttyS2.
SERIAL_CONSOLES = "1500000;ttyFIQ0"

# Keep the board DTB and U-Boot artifacts available to Balena's boot and
# flasher images. The board files are supplied by the Seeed U-Boot/kernel
# integration patches added in the next bring-up step.
IMAGE_INSTALL:append = " \
    kernel-devicetree \
    u-boot-extlinux \
    rockchip-mpp \
    gstreamer1.0-rockchip \
    rockchip-rkaiq-server \
    rockchip-rkaiq-iqfiles \
    rockchip-rkisp-server \
    rockchip-rkisp-iqfiles \
"
