CONFIG_ARCH_ROCKCHIP=y
CONFIG_BLOCK=y
CONFIG_COMMON_CLK_ROCKCHIP=y
CONFIG_NVMEM=y
CONFIG_ARM_ROCKCHIP_CPUFREQ=y
CONFIG_SERIAL_8250=y
CONFIG_SERIAL_8250_CONSOLE=y
CONFIG_MMC=y
CONFIG_MMC_BLOCK=y
CONFIG_MMC_DW=y
CONFIG_MMC_DW_ROCKCHIP=y
CONFIG_BLK_DEV_NVME=y
CONFIG_EXT4_FS=y
# The runtime rootA is a mobynit stub: /sbin/init assembles the real OS root
# from the preloaded docker overlay2 layers with an overlayfs mount before
# pivoting into it.  It runs before any module loading, so overlayfs must be
# built in or mobynit dies with "mounting overlay" and PID1 exits.
CONFIG_OVERLAY_FS=y
# balena-engine (balenad) requirements.  The trimmed defconfig left the whole
# container stack out; without bridge/veth/nat/memcg the daemon wedges in
# "activating" forever.  Everything is built in (=y): the runtime OS root is
# an overlay image assembled at boot and module loading is not dependable.
# NF_CONNTRACK comes first: the whole NAT family (NF_NAT, IP_NF_NAT,
# MASQUERADE, XT_NAT) depends on it and silently drops =y without it, which
# leaves balenad with "iptables table 'nat' does not exist".
CONFIG_NF_CONNTRACK=y
CONFIG_MEMCG=y
CONFIG_CGROUP_PIDS=y
CONFIG_BRIDGE=y
CONFIG_BRIDGE_NETFILTER=y
CONFIG_VETH=y
CONFIG_DUMMY=y
CONFIG_MACVLAN=y
CONFIG_IPVLAN=y
CONFIG_VXLAN=y
CONFIG_NF_TABLES=y
CONFIG_NF_TABLES_INET=y
CONFIG_NF_TABLES_IPV4=y
CONFIG_NF_NAT=y
CONFIG_NETFILTER_XT_NAT=y
CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
CONFIG_NETFILTER_XT_MATCH_COMMENT=y
CONFIG_NETFILTER_XT_MATCH_CONNTRACK=y
CONFIG_NETFILTER_XT_TARGET_MASQUERADE=y
CONFIG_IP_NF_FILTER=y
CONFIG_IP_NF_NAT=y
CONFIG_IP_NF_TARGET_MASQUERADE=y
CONFIG_IP_NF_TARGET_REDIRECT=y
CONFIG_POSIX_MQUEUE=y
CONFIG_DEVTMPFS=y
CONFIG_DEVTMPFS_MOUNT=y
CONFIG_TMPFS=y
CONFIG_PROC_FS=y
CONFIG_ROCKCHIP_MPP_PROC_FS=y
CONFIG_RTC_HCTOSYS=y
CONFIG_RTC_HCTOSYS_DEVICE="rtc0"
CONFIG_NET=y
CONFIG_INET=y
CONFIG_USB_SUPPORT=y
CONFIG_USB_DWC3=y
CONFIG_USB_DWC3_OF_SIMPLE=y
CONFIG_USB_XHCI_HCD=y
CONFIG_USB_STORAGE=y

# The vendor defconfig enables the unrelated Broadcom V3D module.  Its
# driver API does not match this kernel tree's DRM scheduler interface and
# RK3588 uses the Rockchip/Mali display path instead.
# CONFIG_DRM_V3D is not set
# The SDK defconfig also enables legacy Mali-400/Midgard drivers whose
# vendor sources do not build against this kernel's 6.1 APIs. RK3588 boot
# and media validation do not require either legacy driver.
# CONFIG_MALI400 is not set
# CONFIG_MALI450 is not set
# CONFIG_MALI_MIDGARD is not set
