#@TYPE: Machine
#@NAME: Seeed reComputer RK3588 DevKit
#@DESCRIPTION: Seeed RK3588 development kit with eMMC, SD, SPI-NOR and NVMe.

require conf/machine/include/rk3588.inc

MACHINEOVERRIDES =. "recomputer-rk3588-devkit:"

PREFERRED_PROVIDER_virtual/kernel = "linux-seeed-rk3588"

KERNEL_DEVICETREE = "rockchip/rk3588-recomputer-rk3588-devkit.dtb"
KERNEL_IMAGETYPE = "Image"
UBOOT_MACHINE = "recomputer-rk3588-devkit_defconfig"

MACHINE_EXTRA_RRECOMMENDS += "kernel-modules"

# The DevKit console is 1500000 baud. ttyS2 is the mainline/meta-rockchip
# console name; the vendor Armbian ttyFIQ0 name is not used by Yocto here.
SERIAL_CONSOLES = "1500000;ttyS2"

# Keep the board DTB and U-Boot artifacts available to Balena's boot and
# flasher images. The board files are supplied by the Seeed U-Boot/kernel
# integration patches added in the next bring-up step.
IMAGE_INSTALL:append = " \
    kernel-devicetree \
    u-boot-extlinux \
"
