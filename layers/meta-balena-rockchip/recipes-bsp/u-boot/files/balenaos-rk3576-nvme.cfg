# NVMe boot support for the reComputer RK3576 DevKit.  The SDK defconfig
# ships without the PCIe/NVMe stack, and this board's flasher media can be
# an NVMe SSD (BalenaOS runtime installs to eMMC; the flasher image itself
# boots from external SD or NVMe).  Merge the controller, phys and the nvme
# command into the vendor U-Boot config; the distro boot environment for
# nvme is injected separately (the 0005 patch already applied to this tree).
CONFIG_PCI=y
CONFIG_DM_PCI=y
CONFIG_DM_PCI_COMPAT=y
CONFIG_CMD_PCI=y
CONFIG_PCI_PNP=y
CONFIG_PCIE_DW_ROCKCHIP=y
CONFIG_PHY_ROCKCHIP_SNPS_PCIE3=y
CONFIG_PHY_ROCKCHIP_NANENG_COMBOPHY=y
CONFIG_NVME=y
CONFIG_CMD_NVME=y

# meta-balena's A/B rollback env scripting (resin_check_altroot in
# env_resin.h) drives bootcount comparisons with setexpr; the SDK rk3576
# defconfig ships with the command disabled.  The decimal-result fix
# (0011-setexpr-store-decimal-result.patch) is already baked into this
# tree, so only the command enablement is needed here.
CONFIG_CMD_SETEXPR=y

# SPI NOR vendor IDs, mirroring the Seeed Armbian U-Boot defconfig for
# this board: the module's NOR (and any populated on production variants)
# must stay enumerable by SPL when booting the SPI loader image.  ZBIT is
# the vendor observed on the sister RK3588 devkit.
CONFIG_SPI_FLASH_ZBIT=y
CONFIG_SPI_FLASH_EON=y
CONFIG_SPI_FLASH_SST=y
CONFIG_SPI_FLASH_XMC=y
CONFIG_SPI_FLASH_XTX=y
CONFIG_SPI_FLASH_ISSI=y
CONFIG_SPI_FLASH_FMSH=y
CONFIG_SPI_FLASH_DOSILICON=y
CONFIG_SPI_FLASH_BOYA=y
CONFIG_SPI_FLASH_NORMEM=y
CONFIG_SPI_FLASH_ATMEL=y
CONFIG_SPI_FLASH_SPANSION=y
CONFIG_SPI_FLASH_STMICRO=y
CONFIG_SPI_FLASH_PUYA=y
