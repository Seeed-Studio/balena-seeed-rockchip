name: Seeed BalenaOS Build

# Scheduled runs only fire on the default branch; GitHub auto-disables
# scheduled workflows on public repos after 60 days without new commits.

on:
  schedule:
    # Monthly on the 1st at 03:00 UTC
    - cron: "0 3 1 * *"
  workflow_dispatch:
    inputs:
      machine:
        description: Board to build (leave empty to build all boards)
        required: false
        type: choice
        options:
          - recomputer-rk3576-devkit
          - recomputer-rk3588-devkit
      yocto_version:
        description: Yocto release series
        required: false
        type: choice
        options:
          - wrynose
        default: wrynose

concurrency:
  group: balenaos-${{ github.workflow }}-${{ github.ref }}-${{ inputs.machine || 'all' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Resolve machines to build
    runs-on: ubuntu-24.04
    outputs:
      machines: ${{ steps.set.outputs.machines }}
    steps:
      - id: set
        env:
          SELECTED: ${{ inputs.machine }}
        run: |
          machines='["recomputer-rk3576-devkit", "recomputer-rk3588-devkit"]'
          if [ -n "$SELECTED" ]; then
            machines="[\"$SELECTED\"]"
          fi
          echo "machines=$machines" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.machine }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    needs: prepare

    strategy:
      fail-fast: false
      matrix:
        machine: ${{ fromJSON(needs.prepare.outputs.machines) }}

    env:
      MACHINE: ${{ matrix.machine }}
      YOCTO_VERSION: ${{ inputs.yocto_version || 'wrynose' }}
      BUILD_DIR: build-${{ inputs.yocto_version || 'wrynose' }}-${{ matrix.machine }}

    steps:
      # Do NOT add easimon/maximize-build-space: it fallocates a /pv.img loop
      # file on / that consumes all root free space (minus ~4GB reserve) to
      # build an LVM over the build dir, starving the docker daemon whose
      # /var/lib/docker lives on / — do_image_docker's final docker export
      # then fails with "no space left on device" (2026-10-08 run 37738311859).
      # The ~121GB left on / after the cleanup below fits the full build.
      - name: Free up runner disk space
        run: |
          sudo apt-get remove -yq \
            '^dotnet-.*' '^llvm-.*' 'php.*' \
            azure-cli google-cloud-sdk firefox google-chrome-stable \
            powershell mono-complete > /dev/null 2>&1 || true
          sudo apt-get autoremove -y > /dev/null 2>&1 || true
          sudo apt-get clean
          sudo rm -rf "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}" \
            /usr/local/lib/android /usr/local/share/boost \
            /usr/share/dotnet /usr/share/swift \
            /opt/ghc /usr/local/.ghcup
          sudo docker image prune -af > /dev/null 2>&1 || true
          df -h /

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install Yocto host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc build-essential chrpath cpio diffstat file gawk git \
            iputils-ping libacl1 libegl1 lz4 libsdl2-dev \
            mesa-common-dev pylint python3 python3-git python3-jinja2 \
            python3-pexpect python3-subunit socat texinfo unzip \
            wget xterm xz-utils zstd

      - name: Enable BitBake user namespaces
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Build BalenaOS image
        run: |
          set -euo pipefail
          test "$YOCTO_VERSION" = wrynose
          ./balena-yocto-scripts/build/barys \
            --machine "$MACHINE" \
            --build-name "$BUILD_DIR" \
            --bitbake-target balena-image \
            -a "CI_MINIMAL_IMAGE=1" \
            --rm-work \
            --log

      - name: Upload BalenaOS image artifacts
        uses: actions/upload-artifact@v4
        with:
          name: balenaos-${{ matrix.machine }}-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ env.BUILD_DIR }}/tmp/deploy/images/${{ matrix.machine }}/*.balenaos-img*
            ${{ env.BUILD_DIR }}/tmp/deploy/images/${{ matrix.machine }}/*.docker*

      - name: Upload loader artifacts
        uses: actions/upload-artifact@v4
        with:
          name: balenaos-loaders-${{ matrix.machine }}-${{ github.run_number }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            ${{ env.BUILD_DIR }}/tmp/deploy/images/${{ matrix.machine }}/rkspi_loader.img
            ${{ env.BUILD_DIR }}/tmp/deploy/images/${{ matrix.machine }}/spl_loader_maskrom.bin
