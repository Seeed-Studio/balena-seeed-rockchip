# NVMe boot support for the reComputer RK3588 DevKit.  The SDK defconfig
# ships without the PCIe/NVMe stack, and this board boots from an NVMe SSD
# on units whose eMMC does not enumerate.  Merge the controller, phys and
# the nvme command into the vendor U-Boot config; the distro boot
# environment for nvme is injected separately (0005 patch).
CONFIG_PCI=y
CONFIG_DM_PCI=y
CONFIG_DM_PCI_COMPAT=y
CONFIG_CMD_PCI=y
CONFIG_PCI_PNP=y
CONFIG_PCIE_DW_ROCKCHIP=y
CONFIG_PHY_ROCKCHIP_SNPS_PCIE3=y
CONFIG_PHY_ROCKCHIP_NANENG_COMBOPHY=y
CONFIG_NVME=y
CONFIG_CMD_NVME=y

# The board's SPI NOR is a ZBIT chip (JEDEC 5e/40/18); without this option
# the vendor spi_nor_ids table drops the ZB25VQ128 entry (it sits behind
# #ifdef CONFIG_SPI_FLASH_ZBIT) and SPL fails the flash probe, which breaks
# loading the u-boot FIT from the NOR loader image.
CONFIG_SPI_FLASH_ZBIT=y
